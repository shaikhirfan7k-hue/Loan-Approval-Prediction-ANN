<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Applicant Form</title>
<style>body{font-family:Arial,sans-serif;background:#f3f5f8;color:#172033;margin:0}.wrap{max-width:900px;margin:30px auto;padding:26px;background:white;border-radius:14px;box-shadow:0 8px 30px #0001}h1{margin-top:0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}label{display:block;font-weight:bold;margin-bottom:6px}input,select{width:100%;box-sizing:border-box;padding:10px;border:1px solid #c8d0dc;border-radius:7px;background:white}button{margin-top:20px;background:#172b4d;color:white;padding:12px 18px;border:0;border-radius:8px;cursor:pointer}.err{color:#b00020}</style></head>
<body><main class="wrap"><h1>New Applicant Details</h1>{% if error %}<p class="err">{{ error }}</p>{% endif %}<form action="/predict" method="post"><div class="grid">
<div><label>Gender</label><select name="Gender" required><option>Male</option><option>Female</option></select></div>
<div><label>Married</label><select name="Married" required><option>Yes</option><option>No</option></select></div>
<div><label>Dependents</label><select name="Dependents" required><option>0</option><option>1</option><option>2</option><option>3+</option></select></div>
<div><label>Education</label><select name="Education" required><option>Graduate</option><option>Not Graduate</option></select></div>
<div><label>Self Employed</label><select name="Self_Employed" required><option>No</option><option>Yes</option></select></div>
<div><label>Applicant Income</label><input name="ApplicantIncome" type="number" min="0" step="any" required></div>
<div><label>Coapplicant Income</label><input name="CoapplicantIncome" type="number" min="0" step="any" required></div>
<div><label>Loan Amount (in thousands)</label><input name="LoanAmount" type="number" min="0" step="any" required></div>
<div><label>Loan Amount Term (months)</label><input name="Loan_Amount_Term" type="number" min="1" step="any" required></div>
<div><label>Credit History (0 or 1)</label><select name="Credit_History" required><option value="1">1 - Good</option><option value="0">0 - Poor/No history</option></select></div>
<div><label>Property Area</label><select name="Property_Area" required><option>Urban</option><option>Semiurban</option><option>Rural</option></select></div>
</div><button type="submit">Predict Loan Approval</button></form></main></body></html>
